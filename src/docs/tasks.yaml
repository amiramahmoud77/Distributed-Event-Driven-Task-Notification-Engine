paths:
  /api/v1/tasks:
    get:
      summary: Get all tasks for the authenticated user
      tags: [Tasks]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of tasks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: 60d0fe4f5311236168a109ca
                    title:
                      type: string
                      example: Finish backend documentation
                    description:
                      type: string
                      example: Write Swagger YAML files
                    status:
                      type: string
                      example: pending
        '401':
          description: Unauthorized (missing or invalid token)

    post:
      summary: Create a new task
      tags: [Tasks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Implement Redis queue
                description:
                  type: string
                  example: Setup BullMQ workers for task processing
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Task created successfully
                  task:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 60d0fe4f5311236168a109ca
                      title:
                        type: string
                        example: Implement Redis queue
        '400':
          description: Validation error or missing title
        '401':
          description: Unauthorized (missing or invalid token)