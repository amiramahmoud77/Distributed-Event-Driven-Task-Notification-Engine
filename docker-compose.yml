services:
  app:
    build: .
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo:27017/task-engine
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://app:5000
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  mongo:
    image: mongo:7
    ports:
       - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongo_data: